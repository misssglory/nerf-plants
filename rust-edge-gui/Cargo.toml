[package]
name = "rust-edge-gui"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.35.0", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "wayland",
  "x11",
] }
image = "0.25"
rayon = "1.10"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
